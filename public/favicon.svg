<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White offset shadow of the main orange square -->
  <rect x="70" y="70" width="380" height="380" fill="#ffffff" />
  
  <!-- Main Orange Square with White Border -->
  <rect x="40" y="40" width="380" height="380" fill="#ff6600" stroke="#ffffff" stroke-width="20" stroke-linejoin="miter" />
  
  <!-- Lucide Award Icon (scaled up and perfectly centered) inside the Orange Square -->
  <g transform="translate(110, 110) scale(10)" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Circle of the medal -->
    <circle cx="12" cy="8" r="7" stroke="#000000" stroke-width="2" />
    <!-- Ribbon tails of the medal -->
    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" stroke="#000000" stroke-width="2" fill="none" />
  </g>
</svg>